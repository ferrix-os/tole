[package]
name = "tole"
description = "Ferrix's UI framework: a retained item tree with typed properties and bindings, layouts and a CPU renderer, after Qt Quick (Ferrix's docs/UI-FRAMEWORK.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tole"
path = "src/lib.rs"

[features]
# The window: a toplevel through compositor-toolkit, Ferrix's own Wayland
# client runtime, which also runs on any Wayland desktop (no libwayland).
wayland = ["dep:compositor-toolkit"]

[dependencies]
# Pictures for the `Image` item and the file chooser's preview: PNG, JPEG
# and SVG into tiny-skia pixmaps, the desktop clients' own decoders.
compositor-image = { path = "../../compositor/image" }
# The file chooser's regular-expression search: the compositor's RE2-like
# matcher, which gives up rather than hang on a pathological pattern.
compositor-regex = { path = "../../compositor/regex" }
compositor-toolkit = { path = "../../compositor/toolkit", optional = true }
# Fonts, shaping and glyphs: the desktop's own text.
compositor-text = { path = "../../compositor/text" }
# What a frame is drawn with. The same exact pin as compositor-render and
# compositor-text, for the same reason; the default features stay off.
# The PNG writer's deflate: pure Rust, MIT, zlib or Apache-2.0, already in
# the compositor's tree through its image decoders.
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }

[lints]
workspace = true

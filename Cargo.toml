# tole: Ferrix's UI framework, after Qt Quick and QML. Its design is
# docs/UI-FRAMEWORK.md in Ferrix (https://github.com/ferrix-os/ferrix).
#
# A component of Ferrix: its checkout in a Ferrix tree is
# src/user/system/linux/tole (components.toml), beside the compositor's
# workspace, whose `text` crate (fonts, shaping, glyphs) tole draws text
# with and whose `toolkit` (the Wayland client runtime) its window backend
# will use, behind a feature. Both are reached by path from here, so tole
# builds wherever that layout is: in a Ferrix tree, or in CI, which checks
# Ferrix's compositor out beside it.
[workspace]
resolver = "3"
members = ["tole", "tole-compiler"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches Ferrix's rust-toolchain.toml.
rust-version = "1.97"
license = "MIT"
publish = false

# ---------------------------------------------------------------------------
# Lints: the compositor's, which tole's code was written to.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_results = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
doc_markdown = "warn"

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
